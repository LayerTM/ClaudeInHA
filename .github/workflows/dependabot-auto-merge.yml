name: Dependabot auto-merge

# Automatically merges Dependabot pull requests for non-major updates once all
# required status checks pass. Major version bumps are left for manual review.
#
# Runs on the plain pull_request event. For pull requests opened by Dependabot
# the workflow token is read-only unless the workflow asks for more, so the
# permissions block below is what lets the job enable auto-merge. The job never
# checks out or executes the PR's code — it only reads Dependabot's metadata and
# enables auto-merge, which then waits for the branch-protection required
# checks before merging.
#
# On pull_request the workflow definition comes from the pull request's merge
# commit, so a Dependabot bump of this very file would run its new action pins
# with the write token before anyone reviews them. The guard job therefore runs
# first, with a run step only (no action), and holds such a pull request for
# review: the auto-merge job starts only when this file is not among the
# changed files.
#
# A merge made with the workflow token raises no push event, so once the pull
# request has merged this job starts the main-measured workflow, which runs CI
# for the head of main unless it already has a run. That workflow also has a
# schedule, but GitHub does not guarantee scheduled runs, so this dispatch is
# what measures a bot merge.

on: pull_request

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  guard:
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.files.outputs.proceed }}
    steps:
      - name: Hold a change to this workflow for review
        id: files
        # Fail closed: a file list that cannot be read counts as a change to
        # this workflow.
        run: |
          if files="$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')" \
            && [ -n "$files" ] \
            && ! printf '%s\n' "$files" | grep -qxF '.github/workflows/dependabot-auto-merge.yml'; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          echo "::notice::this pull request changes the auto-merge workflow, or its file list could not be read; it is held for review"
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "needs review"
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  auto-merge:
    needs: guard
    if: ${{ needs.guard.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        # Pinned to an immutable commit SHA (this job runs with write scope). The version comment lets Dependabot's
        # github-actions updater keep the pin current.
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for known minor/patch updates
        id: enable
        # Fail-closed allowlist: only explicitly-recognized minor/patch updates
        # auto-merge. Majors — and any PR whose update-type can't be determined —
        # fall through to manual review instead of merging by default.
        if: ${{ contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), steps.metadata.outputs.update-type) }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Measure main once the pull request has merged
        if: ${{ steps.enable.conclusion == 'success' }}
        run: |
          answered=0
          for _ in $(seq 1 80); do
            # A failed call counts as "not merged yet"; the next poll retries it.
            state="$(gh pr view "$PR_URL" --json state --jq .state)" || state=""
            [ -n "$state" ] && answered=1
            case "$state" in
              MERGED)
                for _ in 1 2 3; do
                  if gh workflow run main-measured.yml --repo "$REPO" --ref main; then
                    echo "::notice::merged; main-measured dispatched"
                    exit 0
                  fi
                  sleep 10
                done
                echo "::error::merged, but main-measured could not be dispatched"
                exit 1 ;;
              CLOSED)
                echo "closed without a merge"
                exit 0 ;;
            esac
            sleep 30
          done
          if [ "$answered" = 0 ]; then
            echo "::error::the pull request state could not be read"
            exit 1
          fi
          echo "::warning::not merged within 40 minutes; main is not measured for this merge"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
