name: canary

# Once a day (or on demand) the whole CI runs on main with every upstream pin
# moved to its latest release in the image build, so an upstream that breaks the
# add-on turns this run red before a release carries it. Nothing is committed.
# It lives apart from ci.yml so that a CI run of ci.yml always measures the
# commit as it is.

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      canary: true
    # A called workflow may not ask for more than its caller grants. ci.yml's
    # release job asks for contents: write and is skipped here; its pins-bump
    # job also asks for actions and pull-requests: write, and opens the bump
    # pull request when this run finds a pin behind on main.
    permissions:
      actions: write
      contents: write
      pull-requests: write
