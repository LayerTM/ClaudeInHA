name: ci

# Every gate this repository has, in one workflow, so that the release job can
# depend on all of them for the same commit. They used to live in three separate
# workflows with identical triggers, which made "release only what passed"
# unexpressible: `needs` cannot reach across workflows, and the alternative —
# reacting to another workflow's completion — is a second graph that can
# disagree with the first about which commit it is talking about.

on:
  push:
    branches: [main]
  pull_request:
  # A dispatched run measures the branch as it is (main-measured.yml starts one
  # for a commit that landed without a push event). cut_release is the one
  # thing that also cuts a release from this trigger: release-cadence.yml sets
  # it, once a day or on a maintainer's explicit dispatch, so a plain re-run of
  # CI (main-measured.yml, or a human re-checking a commit) never ships one.
  workflow_dispatch:
    inputs:
      cut_release:
        description: Cut a release for main's current version if one is pending
        type: boolean
        default: false
  # canary.yml calls this workflow with canary: true.
  workflow_call:
    inputs:
      canary:
        description: Build the image with every upstream pin moved to its latest release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prompt-server:
    name: Prompt server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Assemble the add-on with its pinned core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/core_archive.sh "${RUNNER_TEMP}/core"
          claude-code/core/assemble.sh "${RUNNER_TEMP}/core/core.tar" claude-code "${RUNNER_TEMP}/addon"
      - name: Install dependencies
        working-directory: ${{ runner.temp }}/addon/app
        run: '"${RUNNER_TEMP}/addon/install-tools/npm-ci-checked.sh"'
      - name: Run tests
        working-directory: ${{ runner.temp }}/addon/app
        run: npm test
      # Invoked by path, not `npm run`: these seven .test.sh files live only in
      # this repo, so this workflow owns their names instead of depending on
      # the shared core's assembled package.json to keep declaring them.
      - name: Run alerts loop tests (bash + jq)
        working-directory: ${{ runner.temp }}/addon/app
        run: node test-support/hermetic-test.js bash test/cc-alerts.test.sh

      - name: Run config-list tests (bash + jq)
        working-directory: ${{ runner.temp }}/addon/app
        run: node test-support/hermetic-test.js bash test/config-list.test.sh

      - name: Run monitoring loop tests (bash)
        working-directory: ${{ runner.temp }}/addon/app
        run: node test-support/hermetic-test.js bash test/cc-monitor.test.sh

      - name: Run morning briefing tests (bash + jq)
        working-directory: ${{ runner.temp }}/addon/app
        run: node test-support/hermetic-test.js bash test/cc-digest.test.sh

      - name: Run audit-log hook tests (bash + jq)
        working-directory: ${{ runner.temp }}/addon/app
        run: node test-support/hermetic-test.js bash test/cc-hook-audit.test.sh

      - name: Run status line migration tests (bash + jq)
        working-directory: ${{ runner.temp }}/addon/app
        run: node test-support/hermetic-test.js bash test/cc-statusline.test.sh

      - name: Run settings.json writer tests (bash + jq)
        working-directory: ${{ runner.temp }}/addon/app
        run: node test-support/hermetic-test.js bash test/settings-file.test.sh

  lint-js:
    name: JS lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Assemble the add-on with its pinned core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/core_archive.sh "${RUNNER_TEMP}/core"
          claude-code/core/assemble.sh "${RUNNER_TEMP}/core/core.tar" claude-code "${RUNNER_TEMP}/addon"
      - name: Install dependencies
        working-directory: ${{ runner.temp }}/addon/app
        run: '"${RUNNER_TEMP}/addon/install-tools/npm-ci-checked.sh"'
      - name: Lint (eslint)
        working-directory: ${{ runner.temp }}/addon/app
        run: npm run lint
      - name: Type-check (tsc --checkJs)
        working-directory: ${{ runner.temp }}/addon/app
        run: npm run typecheck

  addon-linter:
    name: Add-on linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint the add-on
        uses: frenck/action-addon-linter@v2
        with:
          path: "./claude-code"

  hadolint:
    name: Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: claude-code/Dockerfile
          ignore: DL3003,DL3008,DL3013,DL3018,DL3059,SC2015

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Self-test the scanner
        working-directory: .github/scripts
        run: python test_secret_scan.py
      - name: Scan tracked files for secrets and personal data
        run: python .github/scripts/secret_scan.py .

  # A repository is copied onto machines nothing like the one it was written on.
  # An absolute home or temporary path, a symlink pointing outside the clone, a
  # link to an authoring transcript or an attribution trailer left in a tracked
  # file all work on exactly one computer and are dead everywhere else.
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Self-test the scanner
        working-directory: .github/scripts
        run: python test_hygiene_scan.py
      - name: Scan tracked files for traces of one machine
        run: python .github/scripts/hygiene_scan.py .

  # What a release is allowed to depend on is a list, and a list goes stale the
  # first time a gate is added without touching it. This asserts the release job
  # waits for every other job in this file — on the pull request that adds one,
  # rather than on main after a release has already been cut past it.
  workflow-gates:
    name: Workflow gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install --quiet --disable-pip-version-check pyyaml
      - name: Test the script that checks the gate list
        run: python3 .github/scripts/test_ci_gates.py
      - name: Every gate is a gate the release waits for, and no image step has a network
        run: python3 .github/scripts/ci_gates.py

  # Where every upstream pin comes from is declared beside it (see pins.py).
  # Always runs, so the release can need it; it only asks the upstreams when this
  # commit carries a version that has no release yet — i.e. on the pull request
  # that bumps the version and on any run that would cut it. A release therefore
  # never ships a pin that is behind, and an upstream that cannot be read fails it.
  #
  # A pin behind its upstream fails a pull request. On main it does not fail the
  # commit, which passed before the upstream published: the run records drift,
  # the release waits for it, and pins-bump opens the pull request that moves
  # the pins (pins_drift.py). An upstream that cannot be read fails everywhere.
  pins:
    name: Upstream pins
    runs-on: ubuntu-latest
    outputs:
      drift: ${{ steps.check.outputs.drift }}
    steps:
      - uses: actions/checkout@v7
      - name: Test the script that reads the pins
        run: python3 .github/scripts/test_pins.py
      - name: Test the script that decides what a pin behind its upstream means
        run: python3 .github/scripts/test_pins_drift.py
      - name: Test the script that resolves the release version and its notes
        run: python3 .github/scripts/test_release_notes.py
      # The add-on store offers config.yaml's version from main the moment a
      # pull request merges, released or not, so the version moves only in the
      # pull request that releases it ("Release X.Y.Z"). Until then a pull
      # request writes its changelog lines under "## Unreleased", the first
      # section, and the release pull request renames that heading to its
      # version. The title comes from the event that started the run: a pull
      # request retitled afterwards is checked again by its next push, or by
      # closing and reopening it.
      - name: The version moves only in its release pull request
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Which changelog sections are released is asked of GitHub.
          GH_TOKEN: ${{ github.token }}
        run: |
          # A run before the pull request exists (a local run of this
          # workflow, number 0) has no title yet: the head commit's subject
          # is the title the pull request will be opened with.
          title="${TITLE}"
          if [ "${PR_NUMBER:-0}" = "0" ]; then
            title="$(git log -1 --format=%s HEAD)"
            echo "No pull request yet; its title will be the head commit's subject: ${title}"
          fi
          # The checkout is shallow; fetch the base commit only when it is missing.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          fi
          base="${RUNNER_TEMP}/base-config.yaml"
          # A base without the file has no version: adding it is a move.
          if ! git show "${BASE_SHA}:claude-code/config.yaml" > "${base}"; then rm -f "${base}"; fi
          base_log="${RUNNER_TEMP}/base-changelog.md"
          if ! git show "${BASE_SHA}:claude-code/CHANGELOG.md" > "${base_log}"; then rm -f "${base_log}"; fi
          python3 .github/scripts/release_notes.py version-move "${base}" claude-code/config.yaml "${title}" \
            --changelog claude-code/CHANGELOG.md --base-changelog "${base_log}"
      - name: Does this commit carry an unreleased version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 .github/scripts/release_notes.py version claude-code/config.yaml)"
          # 0 released, 1 none, 2 gh could not say. This job only ever adds a
          # check, so when gh cannot say it takes the stricter reading, out
          # loud: pins are compared as if the version were unreleased.
          status=0
          python3 .github/scripts/release_notes.py released "${version}" || status=$?
          case "${status}" in
            0)
              echo "v${version} is already released — the pins are checked when the version moves."
              echo "unreleased=false" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "v${version} has no release yet — every pin must match its upstream."
              echo "unreleased=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::warning::could not tell whether v${version} is released — checking every pin as if it were not"
              echo "unreleased=true" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Every pin matches its upstream
        id: check
        if: steps.release.outputs.unreleased == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Drift is what the check printed as "behind", not its exit status
          # alone: a crash exits 1 too.
          set -o pipefail
          status=0
          python3 .github/scripts/pins.py check | tee "${RUNNER_TEMP}/pins-check.txt" || status=$?
          python3 .github/scripts/pins_drift.py verdict "${status}" "${RUNNER_TEMP}/pins-check.txt"

  # The pull request for drift that main recorded: one branch, pins/bump, kept
  # at exactly what `pins.py bump` writes on top of main, and CI started on it
  # (a pull request opened with the workflow token raises no event of its own).
  # Its content is this repository's own script run on main's own tree. It runs
  # on every run so that the release can wait for it; only drift gives it work.
  pins-bump:
    name: Upstream pins bump
    needs: pins
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    # No concurrency group: a queued run would be cancelled, not green. Two runs
    # of main writing the branch at once are settled by the push itself (a
    # lease on what was read, read again when it moved), and a run of an older
    # main never rewinds a branch built on a newer one.
    steps:
      - name: Nothing to move
        if: needs.pins.outputs.drift != 'true'
        run: echo "No pin is behind on this run."
      - uses: actions/checkout@v7
        if: needs.pins.outputs.drift == 'true'
        with:
          # Which commits on the branch are not main's is a question about
          # history; a shallow clone would count main's own as a person's.
          fetch-depth: 0
      # pins.py bump refreshes package-lock.json files with npm.
      - uses: actions/setup-node@v7
        if: needs.pins.outputs.drift == 'true'
        with:
          node-version: "26"
      - name: Open or update the bump pull request
        if: needs.pins.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/pins_drift.py open-pr

  # The architectures come from the add-on's own files rather than being listed
  # here, so adding one cannot leave it unbuilt — and the script refuses to answer
  # when config.yaml and build.yaml disagree about the set.
  arches:
    name: Architectures
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install --quiet --disable-pip-version-check pyyaml
      - name: Test the script the matrix comes from
        run: python3 .github/scripts/test_addon_arches.py
      - name: Read the architectures the add-on declares
        id: read
        run: |
          list="$(python3 .github/scripts/addon_arches.py)"
          echo "Declared architectures: ${list}"
          echo "list=${list}" >> "$GITHUB_OUTPUT"

  # The add-on is built on the ha-agent-core release its lock pins. A pin is
  # merged only once that release exists and publishes this very lock, and a
  # version once pinned keeps its URL, commit and digest.
  core-release:
    name: Pinned core is released
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: The lock is well formed and keeps what main pinned
        run: |
          lock=claude-code/core/core.lock.json
          previous=()
          if git show origin/main:"${lock}" > "${RUNNER_TEMP}/previous.lock.json" 2>/dev/null; then
            previous=(--previous-lock "${RUNNER_TEMP}/previous.lock.json")
          fi
          node claude-code/core/verify-core.js check --lock "${lock}" \
            --adapter-api "$(node -p 'require(process.argv[1]).adapterApi' "${PWD}/${lock}")" "${previous[@]}"
      - name: The pinned version is published with this lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lock=claude-code/core/core.lock.json
          version="$(node -p 'require(process.argv[1]).version' "${PWD}/${lock}")"
          if ! gh release download "v${version}" --repo LayerTM/ha-agent-core \
               --pattern core.lock.json --dir "${RUNNER_TEMP}/published"; then
            echo "ha-agent-core v${version} is not released; this pin cannot be merged yet."
            exit 1
          fi
          node -e 'require("node:assert").deepStrictEqual(require(process.argv[1]), require(process.argv[2]))' \
            "${PWD}/${lock}" "${RUNNER_TEMP}/published/core.lock.json"
          echo "ha-agent-core v${version} is published with this lock."

  # A broken Dockerfile used to be invisible until a user's own update rebuilt
  # the image on their device. This builds it for every declared architecture,
  # natively, and publishes nothing.
  image:
    name: Add-on image (${{ matrix.arch }})
    needs: arches
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.arches.outputs.list) }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install --quiet --disable-pip-version-check pyyaml
      # Before the canary: a bump refreshes package-lock.json files with npm.
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: "Canary: move every pin to its latest upstream release (not committed)"
        if: inputs.canary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/pins.py bump
          git diff --stat
      - name: Build the add-on image (no push)
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/addon_image.sh build '${{ matrix.arch }}' 'addon-image:${{ matrix.arch }}'
      - name: Check the image runs what it ships
        run: .github/scripts/addon_image.sh check '${{ matrix.arch }}' 'addon-image:${{ matrix.arch }}'

  # The image a release ships. A release pull request from this repository
  # publishes a candidate built from its tree, `<image>:<version>-rc.<tree>`,
  # through the same script and checks as the image job above; that candidate
  # is what is tried before the release, and the merge promotes it unchanged.
  # Every other run skips these steps, so the release can still need the job.
  # A candidate that exists is never rebuilt: a re-run would replace the image
  # that was tried with one that was not.
  candidate:
    name: Release candidate image (${{ matrix.arch }})
    needs: arches
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.arches.outputs.list) }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install --quiet --disable-pip-version-check pyyaml
      - name: Does this run publish a candidate
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANARY: ${{ inputs.canary && 'true' || 'false' }}
        run: |
          if [ "${EVENT}" = pull_request ]; then
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            fi
            export BASE_CONFIG="${RUNNER_TEMP}/base-config.yaml"
            if ! git show "${BASE_SHA}:claude-code/config.yaml" > "${BASE_CONFIG}"; then rm -f "${BASE_CONFIG}"; fi
          fi
          python3 .github/scripts/addon_image.py plan | tee -a "$GITHUB_OUTPUT"
      - name: Log in to the registry
        if: steps.plan.outputs.publish == 'true'
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "${TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin
      - name: Is this tree's candidate already published
        id: have
        if: steps.plan.outputs.publish == 'true'
        run: |
          ref="$(python3 .github/scripts/addon_image.py candidate)"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "${ref}" > /dev/null 2>&1; then
            echo "${ref} exists; it is the candidate that was tried and is not rebuilt."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.have.outputs.exists == 'false'
        with:
          node-version: "26"
      - name: Build the candidate
        if: steps.have.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/addon_image.sh build '${{ matrix.arch }}' '${{ steps.have.outputs.ref }}-${{ matrix.arch }}'
      - name: Check the candidate runs what it ships
        if: steps.have.outputs.exists == 'false'
        run: .github/scripts/addon_image.sh check '${{ matrix.arch }}' '${{ steps.have.outputs.ref }}-${{ matrix.arch }}'
      - name: Push the checked image
        if: steps.have.outputs.exists == 'false'
        run: docker push '${{ steps.have.outputs.ref }}-${{ matrix.arch }}'

  # One multi-arch manifest per candidate: the Supervisor pulls the generic name
  # and the registry hands each device its own architecture.
  candidate-manifest:
    name: Release candidate manifest
    needs: [arches, candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install --quiet --disable-pip-version-check pyyaml
      - name: Does this run publish a candidate
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANARY: ${{ inputs.canary && 'true' || 'false' }}
        run: |
          if [ "${EVENT}" = pull_request ]; then
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            fi
            export BASE_CONFIG="${RUNNER_TEMP}/base-config.yaml"
            if ! git show "${BASE_SHA}:claude-code/config.yaml" > "${BASE_CONFIG}"; then rm -f "${BASE_CONFIG}"; fi
          fi
          python3 .github/scripts/addon_image.py plan | tee -a "$GITHUB_OUTPUT"
      - name: Join the architectures into one manifest
        if: steps.plan.outputs.publish == 'true'
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          ARCHES: ${{ needs.arches.outputs.list }}
        run: |
          printf '%s' "${TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin
          ref="$(python3 .github/scripts/addon_image.py candidate)"
          if docker buildx imagetools inspect "${ref}" > /dev/null 2>&1; then
            echo "${ref} exists and is kept."
          else
            mapfile -t sources < <(python3 -c 'import json,os,sys; [print(sys.argv[1] + "-" + a) for a in json.loads(os.environ["ARCHES"])]' "${ref}")
            docker buildx imagetools create --tag "${ref}" "${sources[@]}"
          fi
          docker buildx imagetools inspect "${ref}"

  # The commit that offers a new version is the release pull request's merge.
  # The candidate built from that tree becomes `<image>:<version>` by copying
  # its manifest — nothing is rebuilt, so the digest released is the digest
  # that was tried. A version already published is never moved.
  promote:
    name: Promote the release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install --quiet --disable-pip-version-check pyyaml
      - name: Publish the offered version from its candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.canary
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          if ! python3 .github/scripts/addon_image.py name > /dev/null; then
            echo "config.yaml names no image; nothing to promote."
            exit 0
          fi
          released="$(python3 .github/scripts/addon_image.py released-ref)"
          printf '%s' "${TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin
          if docker buildx imagetools inspect "${released}" > /dev/null 2>&1; then
            echo "${released} is already published; a published version never moves."
            exit 0
          fi
          candidate="$(python3 .github/scripts/addon_image.py candidate)"
          digest="$(docker buildx imagetools inspect "${candidate}" --format '{{json .Manifest}}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          image="${released%:*}"
          docker buildx imagetools create --tag "${released}" "${image}@${digest}"
          now="$(docker buildx imagetools inspect "${released}" --format '{{json .Manifest}}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          if [ "${now}" != "${digest}" ]; then
            echo "${released} is ${now}, not the candidate ${digest}."
            exit 1
          fi
          echo "${released} = ${candidate} = ${digest}"

  # What main's config.yaml offers is what every install is offered, so the
  # image for that version must be pullable by a device that has no
  # credentials. A pull request that would offer a version with no public
  # image fails here instead of failing every update after it merges.
  offered-image:
    name: Offered version has a public image
    needs: promote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install --quiet --disable-pip-version-check pyyaml
      - name: Test the script that reads and publishes the image
        run: python3 .github/scripts/test_addon_image.py
      - name: Does this pull request offer a new version
        id: plan
        if: github.event_name == 'pull_request'
        env:
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          fi
          export BASE_CONFIG="${RUNNER_TEMP}/base-config.yaml"
          if ! git show "${BASE_SHA}:claude-code/config.yaml" > "${BASE_CONFIG}"; then rm -f "${BASE_CONFIG}"; fi
          python3 .github/scripts/addon_image.py plan | tee -a "$GITHUB_OUTPUT"
      - name: The offered version can be pulled without credentials
        # A release pull request's own version is published by its merge (see
        # promote); its candidate is checked by candidate-manifest.
        if: steps.plan.outputs.publish != 'true'
        run: python3 .github/scripts/addon_image.py offered

  # Keeps GitHub Releases in lock-step with the add-on version, but no longer
  # from the push that lands a bump: release-cadence.yml dispatches this
  # workflow with cut_release once a day, or a maintainer does it by hand for
  # a fix that cannot wait. Either way this needs every gate above, so a
  # release exists only for a commit that passed all of them on this very run.
  # A version bumped and superseded before its own cut is not lost: notes.md
  # carries every changelog section back to the last real release, not just
  # this version's own.
  release:
    name: Release
    needs:
      - prompt-server
      - lint-js
      - addon-linter
      - hadolint
      - secret-scan
      - hygiene
      - workflow-gates
      - pins
      - pins-bump
      - arches
      - core-release
      - image
      - candidate
      - candidate-manifest
      - promote
      - offered-image
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.cut_release == true &&
      !inputs.canary &&
      needs.pins.outputs.drift != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version from config.yaml
        id: v
        run: |
          version="$(python3 .github/scripts/release_notes.py version claude-code/config.yaml)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          tag="v${VERSION}"
          # 0 released, 1 none, 2 gh could not say — which must stop the job,
          # not be taken for "none" and cut a release nobody checked.
          status=0
          python3 .github/scripts/release_notes.py released "${VERSION}" || status=$?
          case "${status}" in
            0)
              echo "Release ${tag} already exists — nothing to do."
              exit 0
              ;;
            1) ;;
            *) exit "${status}" ;;
          esac
          python3 .github/scripts/release_notes.py notes claude-code/config.yaml \
            claude-code/CHANGELOG.md --write notes.md
          gh release create "${tag}" \
            --title "${tag}" \
            --notes-file notes.md \
            --target "${SHA}"
          echo "Created release ${tag}."
