name: ci

# Every gate this repository has, in one workflow, so that the release job can
# depend on all of them for the same commit. They used to live in three separate
# workflows with identical triggers, which made "release only what passed"
# unexpressible: `needs` cannot reach across workflows, and the alternative —
# reacting to another workflow's completion — is a second graph that can
# disagree with the first about which commit it is talking about.

on:
  push:
    branches: [main]
  pull_request:
  # A dispatched run measures the branch as it is (main-measured.yml starts one
  # for a commit that landed without a push event).
  workflow_dispatch:
  # canary.yml calls this workflow with canary: true.
  workflow_call:
    inputs:
      canary:
        description: Build the image with every upstream pin moved to its latest release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prompt-server:
    name: Prompt server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Assemble the add-on with its pinned core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/core_archive.sh "${RUNNER_TEMP}/core"
          claude-code/core/assemble.sh "${RUNNER_TEMP}/core/core.tar" claude-code "${RUNNER_TEMP}/addon"
      - name: Install dependencies
        working-directory: ${{ runner.temp }}/addon/app
        run: '"${RUNNER_TEMP}/addon/install-tools/npm-ci-checked.sh"'
      - name: Run tests
        working-directory: ${{ runner.temp }}/addon/app
        run: npm test
      - name: Run alerts loop tests (bash + jq)
        working-directory: ${{ runner.temp }}/addon/app
        run: npm run test:alerts

      - name: Run config-list tests (bash + jq)
        working-directory: ${{ runner.temp }}/addon/app
        run: npm run test:config

      - name: Run monitoring loop tests (bash)
        working-directory: ${{ runner.temp }}/addon/app
        run: npm run test:monitor

      - name: Run morning briefing tests (bash + jq)
        working-directory: ${{ runner.temp }}/addon/app
        run: npm run test:digest

      - name: Run audit-log hook tests (bash + jq)
        working-directory: ${{ runner.temp }}/addon/app
        run: npm run test:audit

      - name: Run status line migration tests (bash + jq)
        working-directory: ${{ runner.temp }}/addon/app
        run: npm run test:statusline

      - name: Run usage report tests (bash + python3)
        working-directory: ${{ runner.temp }}/addon/app
        run: npm run test:usage

  lint-js:
    name: JS lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Assemble the add-on with its pinned core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/core_archive.sh "${RUNNER_TEMP}/core"
          claude-code/core/assemble.sh "${RUNNER_TEMP}/core/core.tar" claude-code "${RUNNER_TEMP}/addon"
      - name: Install dependencies
        working-directory: ${{ runner.temp }}/addon/app
        run: '"${RUNNER_TEMP}/addon/install-tools/npm-ci-checked.sh"'
      - name: Lint (eslint)
        working-directory: ${{ runner.temp }}/addon/app
        run: npm run lint
      - name: Type-check (tsc --checkJs)
        working-directory: ${{ runner.temp }}/addon/app
        run: npm run typecheck

  addon-linter:
    name: Add-on linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint the add-on
        uses: frenck/action-addon-linter@v2
        with:
          path: "./claude-code"

  hadolint:
    name: Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: claude-code/Dockerfile
          ignore: DL3003,DL3008,DL3013,DL3018,DL3059,SC2015

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Self-test the scanner
        working-directory: .github/scripts
        run: python test_secret_scan.py
      - name: Scan tracked files for secrets and personal data
        run: python .github/scripts/secret_scan.py .

  # A repository is copied onto machines nothing like the one it was written on.
  # An absolute home or temporary path, a symlink pointing outside the clone, a
  # link to an authoring transcript or an attribution trailer left in a tracked
  # file all work on exactly one computer and are dead everywhere else.
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Self-test the scanner
        working-directory: .github/scripts
        run: python test_hygiene_scan.py
      - name: Scan tracked files for traces of one machine
        run: python .github/scripts/hygiene_scan.py .

  # What a release is allowed to depend on is a list, and a list goes stale the
  # first time a gate is added without touching it. This asserts the release job
  # waits for every other job in this file — on the pull request that adds one,
  # rather than on main after a release has already been cut past it.
  workflow-gates:
    name: Workflow gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install --quiet --disable-pip-version-check pyyaml
      - name: Test the script that checks the gate list
        run: python3 .github/scripts/test_ci_gates.py
      - name: Every gate is a gate the release waits for
        run: python3 .github/scripts/ci_gates.py

  # Where every upstream pin comes from is declared beside it (see pins.py).
  # Always runs, so the release can need it; it only asks the upstreams when this
  # commit carries a version that has no release yet — i.e. on the pull request
  # that bumps the version and on the push that would cut it. A release therefore
  # never ships a pin that is behind, and an upstream that cannot be read fails it.
  pins:
    name: Upstream pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test the script that reads the pins
        run: python3 .github/scripts/test_pins.py
      - name: Does this commit carry an unreleased version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep -oE '^version:[[:space:]]*"?[0-9]+\.[0-9]+\.[0-9]+' claude-code/config.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          if [ -z "${version}" ]; then
            echo "Could not parse version from config.yaml" >&2
            exit 1
          fi
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "v${version} is already released — the pins are checked when the version moves."
            echo "unreleased=false" >> "$GITHUB_OUTPUT"
          else
            echo "v${version} has no release yet — every pin must match its upstream."
            echo "unreleased=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Every pin matches its upstream
        if: steps.release.outputs.unreleased == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/pins.py check

  # The architectures come from the add-on's own files rather than being listed
  # here, so adding one cannot leave it unbuilt — and the script refuses to answer
  # when config.yaml and build.yaml disagree about the set.
  arches:
    name: Architectures
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install --quiet --disable-pip-version-check pyyaml
      - name: Test the script the matrix comes from
        run: python3 .github/scripts/test_addon_arches.py
      - name: Read the architectures the add-on declares
        id: read
        run: |
          list="$(python3 .github/scripts/addon_arches.py)"
          echo "Declared architectures: ${list}"
          echo "list=${list}" >> "$GITHUB_OUTPUT"

  # The add-on is built on the ha-agent-core release its lock pins. A pin is
  # merged only once that release exists and publishes this very lock, and a
  # version once pinned keeps its URL, commit and digest.
  core-release:
    name: Pinned core is released
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: The lock is well formed and keeps what main pinned
        run: |
          lock=claude-code/core/core.lock.json
          previous=()
          if git show origin/main:"${lock}" > "${RUNNER_TEMP}/previous.lock.json" 2>/dev/null; then
            previous=(--previous-lock "${RUNNER_TEMP}/previous.lock.json")
          fi
          node claude-code/core/verify-core.js check --lock "${lock}" \
            --adapter-api "$(node -p 'require(process.argv[1]).adapterApi' "${PWD}/${lock}")" "${previous[@]}"
      - name: The pinned version is published with this lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lock=claude-code/core/core.lock.json
          version="$(node -p 'require(process.argv[1]).version' "${PWD}/${lock}")"
          if ! gh release download "v${version}" --repo LayerTM/ha-agent-core \
               --pattern core.lock.json --dir "${RUNNER_TEMP}/published"; then
            echo "ha-agent-core v${version} is not released; this pin cannot be merged yet."
            exit 1
          fi
          node -e 'require("node:assert").deepStrictEqual(require(process.argv[1]), require(process.argv[2]))' \
            "${PWD}/${lock}" "${RUNNER_TEMP}/published/core.lock.json"
          echo "ha-agent-core v${version} is published with this lock."

  # A broken Dockerfile used to be invisible until a user's own update rebuilt
  # the image on their device. This builds it for every declared architecture,
  # natively, and publishes nothing.
  image:
    name: Add-on image (${{ matrix.arch }})
    needs: arches
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.arches.outputs.list) }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install --quiet --disable-pip-version-check pyyaml
      # Before the canary: a bump refreshes package-lock.json files with npm.
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: "Canary: move every pin to its latest upstream release (not committed)"
        if: inputs.canary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/pins.py bump
          git diff --stat
      - name: Resolve the platform and base image for ${{ matrix.arch }}
        id: target
        run: |
          case "${{ matrix.arch }}" in
            amd64)   platform=linux/amd64 ;;
            aarch64) platform=linux/arm64 ;;
            *)
              echo "No Docker platform is mapped for '${{ matrix.arch }}'."
              echo "It is declared in the add-on but this job does not know how"
              echo "to build it — add the mapping here rather than dropping it."
              exit 1
              ;;
          esac
          echo "platform=${platform}" >> "$GITHUB_OUTPUT"
          echo "from=$(python3 .github/scripts/addon_arches.py --build-from '${{ matrix.arch }}')" >> "$GITHUB_OUTPUT"
      - name: Refuse to pass by emulating the target
        run: |
          # Building arm64 under QEMU would still go green while taking half an
          # hour and exercising a different code path than users get. If the
          # native runner is unavailable this must fail loudly, not quietly
          # emulate: the point of the job is to build what ships.
          want='${{ steps.target.outputs.platform }}'
          have="linux/$(dpkg --print-architecture)"
          if [ "${want}" != "${have}" ]; then
            echo "This runner is ${have} but the job must build ${want}."
            echo "Give this architecture a runner that matches it."
            exit 1
          fi
      - name: Fetch the pinned core
        id: core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source="$(.github/scripts/core_archive.sh "${RUNNER_TEMP}/core")"
          echo "source=${source}" >> "$GITHUB_OUTPUT"
      - name: Build the add-on image (no push)
        run: |
          # Once the pinned core is released the image fetches it itself, as it
          # does on a user's device; before that, the packed archive stands in
          # for the download and is still checked against the lock.
          archive=()
          if [ '${{ steps.core.outputs.source }}' = packed ]; then
            archive=(--build-context "core-archive=${RUNNER_TEMP}/core")
          fi
          docker build --pull \
            "${archive[@]}" \
            --platform '${{ steps.target.outputs.platform }}' \
            --build-arg BUILD_FROM='${{ steps.target.outputs.from }}' \
            --tag 'addon-image:${{ matrix.arch }}' \
            claude-code
      - name: Check the image runs what it shipped
        run: |
          # A build that succeeds and produces a binary that cannot execute on
          # this architecture is the exact failure a user would hit, so ask the
          # image, not the builder.
          docker run --rm --platform '${{ steps.target.outputs.platform }}' \
            --entrypoint /root/.local/bin/claude 'addon-image:${{ matrix.arch }}' --version
          docker run --rm --platform '${{ steps.target.outputs.platform }}' \
            --entrypoint /usr/local/bin/node 'addon-image:${{ matrix.arch }}' \
            -e "require('/opt/claude-console/node_modules/node-pty').spawn('/bin/true', [], {}).onExit(({ exitCode }) => { console.log('node-pty spawns, exit ' + exitCode); process.exit(exitCode); })"
      - name: The bundled CLI accepts every argument list the prompt runner builds
        run: |
          # The lists come from the core and the adapter inside the image, not
          # from a copy, so a CLI bump that drops or renames a flag fails here
          # instead of turning every chat request into an error.
          docker run --rm --platform '${{ steps.target.outputs.platform }}' \
            --volume "${PWD}/.github/scripts:/ci:ro" \
            --entrypoint /usr/local/bin/node 'addon-image:${{ matrix.arch }}' \
            /ci/runner_args_smoke.js /root/.local/bin/claude /opt/claude-console
      - name: Start-up, launch, update and digest behave as recorded
        run: |
          # The service script, the Claude tab launcher, both update paths,
          # provisioning and the morning digest, run inside the image against a
          # recording stand-in for the CLI. What they set up and call is pinned
          # so that moving this code elsewhere can be checked against it.
          docker run --rm --platform '${{ steps.target.outputs.platform }}' \
            --volume "${PWD}/claude-code/app/test/image:/pins-src:ro" \
            --entrypoint bash 'addon-image:${{ matrix.arch }}' /pins-src/behaviour-pins.sh

  # Keeps GitHub Releases in lock-step with the add-on version: whenever main
  # carries a version with no release, this cuts one. It needs every gate above,
  # so a release exists only for a commit that passed all of them — and it asks
  # whether the release is already there rather than guessing from which files a
  # push happened to touch, so a version that missed its release once is picked
  # up by the next push instead of staying missing forever.
  release:
    name: Release
    needs:
      - prompt-server
      - lint-js
      - addon-linter
      - hadolint
      - secret-scan
      - hygiene
      - workflow-gates
      - pins
      - arches
      - core-release
      - image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version from config.yaml
        id: v
        run: |
          version="$(grep -oE '^version:[[:space:]]*"?[0-9]+\.[0-9]+\.[0-9]+' claude-code/config.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          if [ -z "${version}" ]; then
            echo "Could not parse version from config.yaml" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          tag="v${VERSION}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists — nothing to do."
            exit 0
          fi
          # Extract this version's section from the changelog for the notes.
          awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' claude-code/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            printf 'Release %s\n' "${tag}" > notes.md
          fi
          gh release create "${tag}" \
            --title "${tag}" \
            --notes-file notes.md \
            --target "${SHA}"
          echo "Created release ${tag}."
