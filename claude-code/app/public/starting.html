<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Code — starting</title>
<style>
  /* Self-contained on purpose: this page is served while the console's own
     assets are not being served by anything yet. */
  :root {
    --bg: #14141a;
    --bg-raised: #1a1a21;
    --fg: #ede9e0;
    --fg-dim: #9a9aa4;
    --accent: #d97757;
    --border: rgba(255, 255, 255, 0.09);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    max-width: 420px;
    text-align: center;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 32px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
  }
  .spinner {
    width: 26px;
    height: 26px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }
  h1 { font-size: 16px; font-weight: 600; margin: 0; }
  p { font-size: 13px; line-height: 1.5; color: var(--fg-dim); margin: 0; }
</style>
</head>
<body>
<main>
  <div class="box" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Starting the console…</h1>
    <p>The add-on is getting ready. This page opens the console by itself as soon as it is.</p>
  </div>
</main>
<script>
  // The placeholder answers /api/health with 503 while it is the one listening.
  // A 200 means the console itself took the port over, and only then is there
  // something to load.
  const poll = async () => {
    try {
      const r = await fetch('api/health', { cache: 'no-store' });
      if (r.ok) { location.reload(); return; }
    } catch { /* the handover drops connections; keep waiting */ }
    setTimeout(poll, 1500);
  };
  setTimeout(poll, 1500);
</script>
</body>
</html>
